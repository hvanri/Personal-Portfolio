<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Blog | Hà Văn Ri</title>
    <meta name="description" content="A personal blog space for unforgettable moments, hobbies, and life stories." />
    <link rel="canonical" href="https://buildwithri.netlify.app/blog" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/layout/header.css" />
    <link rel="stylesheet" href="css/layout/footer.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/pages/blog.css" />
  </head>
  <body class="blog-page">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="container">
      <main id="main-content" class="journal">
        <header class="journal-masthead" aria-labelledby="journal-title">
          <p class="journal-kicker">Field notes / 2026</p>
          <h1 id="journal-title">Notes from the work.</h1>
          <p class="journal-standfirst">Short entries on what I build, what I am learning, and the moments that keep the work human.</p>
        </header>

        <section class="journal-lead" aria-labelledby="journal-lead-label">
          <p class="journal-marker" id="journal-lead-label">Latest note</p>
          <div id="blog-featured" aria-live="polite"></div>
        </section>

        <section class="journal-index" aria-labelledby="journal-index-label">
          <p class="journal-marker" id="journal-index-label">Earlier notes</p>
          <ol id="blog-posts" class="entry-list"></ol>
          <p id="blog-empty-state" class="journal-note" hidden>No notes published yet.</p>
        </section>
      </main>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
