[build]
  publish = "."
  functions = "netlify/functions"
  # Regenerates sitemap.xml + robots.txt from js/config/routes.js on every deploy.
  command = "npm run build"

# Google Search Console HTML-file verification.
# Served as-is, no redirect: the extensionless variant rewrites (200) back to the
# real file so Netlify's pretty-URL stripping can't turn the check into a 301.
[[redirects]]
  from = "/google0d534718fc897d4a"
  to = "/google0d534718fc897d4a.html"
  status = 200
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/blog.html"
  to = "/blog"
  status = 301
  force = true

[[redirects]]
  from = "/projects.html"
  to = "/projects"
  status = 301
  force = true

[[redirects]]
  from = "/api/recent-posts"
  to = "/.netlify/functions/recent-posts"
  status = 200
  force = true

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
  force = true

[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200
  force = true

[[redirects]]
  from = "/projects"
  to = "/projects.html"
  status = 200
  force = true
